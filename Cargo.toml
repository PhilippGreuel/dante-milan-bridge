[package]
name = "dante-milan-bridge"
version = "0.1.0"
edition = "2021"
description = "Software-Bridge Dante (via Dante Virtual Soundcard) -> AVB/Milan"
license = "MIT"

[features]
default = []
# Windows: ASIO-Treiber der Dante Virtual Soundcard nutzen (benötigt ASIO SDK, siehe README)
asio = ["cpal/asio"]

[dependencies]
cpal = "0.18"
pcap = "2"
netdev = "0.40"
ringbuf = "0.4"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rand = "0.9"
parking_lot = "0.12"
ctrlc = "3"
thread-priority = "1"

[profile.release]
opt-level = 3
lto = true
